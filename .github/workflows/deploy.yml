name: HangiEasy Otomatik Canlıya Alma

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuya Sız ve Kodu Güncelle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/hangieasy-game
            git pull
            source venv/bin/activate
            pip install -r requirements.txt
            sudo sed -i 's|ExecStart=.*|ExecStart=/home/ubuntu/hangieasy-game/venv/bin/gunicorn --workers 1 -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 127.0.0.1:5000 app:app|' /etc/systemd/system/hangieasy.service
            sudo systemctl daemon-reload
            sudo systemctl restart hangieasy